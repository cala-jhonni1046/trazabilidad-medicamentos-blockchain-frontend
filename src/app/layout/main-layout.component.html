<div class="layout-wrapper">
  <div class="test-environment-ribbon">
    <mat-icon class="ribbon-icon">science</mat-icon>
    <span class="ribbon-text">MVP ACADÉMICO — DATOS DEL BACKEND LOCAL — SIN AUTENTICACIÓN</span>
  </div>

  <!-- Barra superior (Encabezado) -->
  <mat-toolbar class="main-header">
    <div class="header-left">
      <button
        mat-icon-button
        (click)="toggleSidenav()"
        aria-label="Alternar barra lateral"
        class="toggle-btn"
      >
        <mat-icon>menu</mat-icon>
      </button>
      <div class="brand">
        <div class="brand-icon">
          <mat-icon>health_and_safety</mat-icon>
        </div>
        <div class="brand-text">
          <span class="brand-title">MediChain</span>
          <span class="brand-subtitle">Trazabilidad Farmacéutica</span>
        </div>
      </div>
    </div>

    <span class="toolbar-spacer"></span>

    <div class="header-right">
      <div class="role-badge">
        <mat-icon class="role-icon">science</mat-icon>
        <span class="role-name">Uso demostrativo</span>
      </div>
    </div>
  </mat-toolbar>

  <!-- Contenedor Sidenav Adaptable -->
  <mat-sidenav-container class="sidenav-container">
    <!-- Barra lateral izquierda -->
    <mat-sidenav
      #sidenav
      [mode]="isMobile() ? 'over' : 'side'"
      [opened]="isSidenavOpen()"
      class="app-sidebar"
    >
      <div class="sidebar-header">
        <span class="nav-section-title">MENÚ PRINCIPAL</span>
      </div>

      <mat-nav-list class="nav-list">
        <a
          mat-list-item
          *ngFor="let item of navItems"
          [routerLink]="item.path"
          routerLinkActive="active-nav-link"
          (click)="onNavItemClick()"
          class="nav-link"
        >
          <mat-icon matListItemIcon class="nav-item-icon">{{ item.icon }}</mat-icon>
          <span matListItemTitle class="nav-item-title">{{ item.title }}</span>
        </a>
      </mat-nav-list>

      <div class="sidebar-footer">
        <div class="footer-card">
          <div class="footer-badge">MVP ACADÉMICO</div>
          <p class="footer-note">Consulta al backend</p>
          <span class="footer-version">Sin blockchain distribuida</span>
        </div>
      </div>
    </mat-sidenav>

    <!-- Cuerpo / Contenido principal -->
    <mat-sidenav-content class="main-content-area">
      <main class="content-inner">
        <router-outlet></router-outlet>
      </main>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
